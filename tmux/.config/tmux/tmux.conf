bind R source-file ~/.tmux.conf \; display "Config reloaded!"

set -g history-limit 100000

unbind C-b
set-option -g prefix C-g
bind-key C-g send-prefix

set -sg escape-time 0

set -g mouse on

# Время показа сообщений (3 секунды = 3000 миллисекунд)
set -g display-time 3000        # для обычных сообщений
set -g display-panes-time 3000  # для номеров панелей при переключении

# rename window
bind-key r command-prompt -I "" "rename-window -- '%%'"

# remote ssh session prefix
# bind C-b send-prefix

# act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Переключение панелей (vim-style) - обычные бинды
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Переключение панелей с Ctrl (без префикса!)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Ресайз панелей
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# pane kill no confirm
unbind-key x
bind-key x kill-pane

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
 
# tmux copy
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

set -s set-clipboard on
set -g allow-passthrough on

# pane control
# unbind-key d
# bind-key d swap-pane -D

set-option -g status-position bottom

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

